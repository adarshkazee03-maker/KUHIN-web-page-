<!-- Blog Card Component -->
<!-- Usage: {% include 'components/card-blog.html' with blog=blog_post %} -->

<div class="blog-card card h-100">
    {% if blog.featured_image %}
        <a href="{% url 'blog:blog_detail' blog.slug %}" class="blog-card-image-link">
            <img src="{{ blog.featured_image.url }}" alt="{{ blog.title }}" class="card-image" loading="lazy">
        </a>
    {% else %}
        <div class="card-image-placeholder">
            <i class="fas fa-newspaper"></i>
        </div>
    {% endif %}
    
    <div class="card-body">
        <div class="blog-card-meta">
            {% if blog.category %}
                <span class="badge badge-primary">{{ blog.category.name }}</span>
            {% endif %}
            <span class="blog-card-date">{{ blog.created_at|date:"M d, Y" }}</span>
        </div>
        
        <h3 class="blog-card-title">
            <a href="{% url 'blog:blog_detail' blog.slug %}">{{ blog.title }}</a>
        </h3>
        
        <p class="blog-card-excerpt text-muted">
            {{ blog.content|truncatewords:30|striptags }}
        </p>
    </div>
    
    <div class="card-footer">
        <a href="{% url 'blog:blog_detail' blog.slug %}" class="btn btn-sm btn-outline w-100">
            <i class="fas fa-arrow-right me-2"></i>Read More
        </a>
    </div>
</div>
