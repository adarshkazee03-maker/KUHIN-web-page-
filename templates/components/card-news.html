<!-- News Card Component -->
<!-- Usage: {% include 'components/card-news.html' with news=news_update %} -->

<article class="glass-panel card-unified h-100 p-0 rounded-4 overflow-hidden d-flex flex-column hover-lift transition-all group border-0 shadow-sm fade-in-up">
    <div class="d-flex flex-column h-100">
        
        <!-- Header / Date Badge -->
        <div class="p-4 pb-0 d-flex justify-content-between align-items-start">
            <div class="d-flex align-items-center text-primary bg-primary bg-opacity-10 rounded-pill px-3 py-1 small fw-bold">
                <i class="far fa-calendar-alt me-2"></i> {{ news.created_at|date:"M d, Y" }}
            </div>
            
            {% if news.slug %}
                <a href="{% url 'newsletter:news_detail' news.slug %}" class="btn btn-light rounded-circle shadow-sm btn-sm text-primary hover-scale" aria-label="Read News" title="Read News">
                    <i class="fas fa-arrow-right"></i>
                </a>
            {% endif %}
        </div>

        <!-- Card Content -->
        <div class="p-4 flex-grow-1 d-flex flex-column">
            
            <!-- Title -->
            <h5 class="card-title fw-bold mb-3 text-dark line-clamp-2" style="min-height: 3rem;">
                {% if news.slug %}
                    <a href="{% url 'newsletter:news_detail' news.slug %}" class="text-decoration-none text-dark stretched-link title-hover transition-colors">
                        {{ news.title }}
                    </a>
                {% else %}
                    {{ news.title }}
                {% endif %}
            </h5>
            
            <!-- Excerpt -->
            <p class="card-text text-muted small flex-grow-1 line-clamp-3 mb-4">
                {{ news.description|striptags|truncatewords:25 }}
            </p>
            
            <!-- Footer -->
            <div class="mt-auto border-top border-light pt-3">
                <div class="d-flex align-items-center justify-content-between text-muted small">
                    <span class="d-flex align-items-center">
                        <i class="fas fa-bullhorn me-2 text-warning opacity-75"></i> Announcement
                    </span>
                    <span class="text-primary fw-bold opacity-0 group-hover-opacity transition-opacity">Read More</span>
                </div>
            </div>
        </div>
    </div>
</article>

<style>
    /* Card Unified Styles */
    .card-unified {
        background: rgba(248, 249, 250, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(226, 232, 240, 0.5) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .card-unified:hover {
        background: rgba(248, 249, 250, 0.85);
        box-shadow: 0 12px 30px rgba(44, 62, 145, 0.15) !important;
    }
    
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    
    .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    
    /* Animations */
    .transition-colors { transition: color 0.2s ease; }
    .transition-opacity { transition: opacity 0.3s ease; }
    
    /* Group Hover Effects */
    .group:hover .title-hover { color: var(--primary-color, #2c3e91) !important; }
    .group:hover .group-hover-opacity { opacity: 1 !important; }
    
    .hover-scale { 
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .hover-scale:hover { 
        transform: scale(1.1);
    }
    
    .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .hover-lift:hover {
        transform: translateY(-8px);
    }
    
    .fade-in-up {
        animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
