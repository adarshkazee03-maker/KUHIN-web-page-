<!-- Section Header Component -->
<!-- Usage: {% include 'components/section-header.html' with title="Section Title" subtitle="Optional subtitle" %} -->

<div class="section-header text-center mb-5 fade-in-up">
    <span class="badge bg-primary bg-opacity-25 text-info border border-info border-opacity-25 rounded-pill px-3 py-2 mb-3 d-inline-block">
        <i class="fas fa-sparkles me-2"></i>Section
    </span>
    <h2 class="section-title fw-bold d-inline-block border-bottom border-4 border-primary pb-2">
        {{ title }}
    </h2>
    {% if subtitle %}
        <p class="section-subtitle text-muted small mt-3">{{ subtitle }}</p>
    {% endif %}
</div>

<style>
    /* Section Header Styles */
    .section-header {
        margin-bottom: 3rem;
        position: relative;
    }
    
    .section-title {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        font-weight: 700;
        color: var(--text-dark, #1e293b);
        margin: 0.5rem 0;
        letter-spacing: -0.025em;
        transition: all 0.3s ease;
    }
    
    .section-subtitle {
        font-size: 1rem;
        color: var(--text-muted, #64748b);
        margin-top: 1rem;
        font-weight: 500;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
    }
    
    /* Animations */
    .fade-in-up {
        animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
        .section-header {
            margin-bottom: 2rem;
        }
        
        .section-title {
            font-size: 1.75rem;
        }
        
        .section-subtitle {
            font-size: 0.95rem;
        }
    }
</style>
